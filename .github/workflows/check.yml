name: Check

on:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build test image locally
        run: docker build -t archivedv-test:local .
      - name: Start test container
        run: docker run -d --name archivedv-test -p 127.0.0.1:3000:3000 archivedv-test:local
      - name: Verify frontend and APIs
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/status > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:3000/ | grep -q '<!DOCTYPE html>'
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          for (const endpoint of ['config', 'status', 'history']) {
            const response = await fetch(`http://127.0.0.1:3000/api/${endpoint}`);
            assert.equal(response.status, 200, endpoint);
            const data = await response.json();
            if (endpoint === 'history') assert.deepEqual(data, []);
            if (endpoint === 'status') assert.deepEqual(data.currentDownloads, []);
            if (endpoint === 'config') assert.deepEqual(data.channels, []);
          }
          JS
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs archivedv-test || true
          docker rm -f archivedv-test || true
